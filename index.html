<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atlas Maintenance France</title>

   <link rel="stylesheet"
       href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #005BAC;
            color: white;
            padding: 15px 20px;
        }

        header h1 {
            margin: 0;
        }

        #map {
            height: calc(100vh - 70px);
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔧 Atlas Maintenance France</h1>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // Création de la carte
        const map = L.map('map').setView([46.6, 2.2], 6);

        // Fond OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Nantes Atlantis
        L.marker([47.224109, -1.623505])
            .addTo(map)
            .bindPopup(
                "<b>NANTES ATLANTIS</b><br>Emmanuel Maillard"
            );

        // Lille
        L.marker([50.6292, 3.0573])
            .addTo(map)
            .bindPopup(
                "<b>LILLE</b>"
            );

        // Paris
        L.marker([48.8566, 2.3522])
            .addTo(map)
            .bindPopup(
                "<b>PARIS</b>"
            );

    </script>

</body>
</html>
