<!DOCTYPE html>
<html lang="fr">
   
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Atlas Maintenance France</title>

<link rel="stylesheet"
   href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
   
html, 
    body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

#search-container {
   position: absolute;
   top: 10px;
   left: 60px;
   z-index: 9999;
   background: white;
   padding: 8px;
   border-radius: 6px;
   box-shadow: 0 2px 5px rgba(0,0,0,0.3);
   }

#searchBox {   
   width: 250px;
   padding: 6px;
   }
   
</style>
   
</head>

<body>

<div id="search-container">
<input
   type="text"
   id="searchBox"
   placeholder="🔍 Rechercher un site..."
   />
<button onclick="searchSite()">Rechercher</button>

 <br><br>

<select id="crmFilter"> 
   <option value="">👤 Tous les Coordinateurs</option>
   </select>

<br><br>

<select id="filialeFilter">
    <option value="">🏢 Toutes les Filiales</option>
</select>

 <br><br>

<select id="mapType">
    <option value="satellite" selected>🛰️ Satellite</option>
    <option value="plan">🗺️ Plan</option>
</select> 
   
</div>
   
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const franceBounds = [
    [41.0, -5.5],
    [51.5, 9.5]
];

const map = L.map('map', {
    maxBounds: franceBounds,
    maxBoundsViscosity: 0.2
}).setView([46.6, 2.2], 7);

   map.setMinZoom(6);
   
const plan = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
);

const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: '&copy; Esri'
    }
);

satellite.addTo(map);

const atlasMarkers = [];
   
const crmList = new Set();

const filialeList = new Set();   
   
fetch('atlas-sites.json')
.then(response => response.json())
.then(data => {

    data.forEach(site => {

        if(site.latitude && site.longitude){

            const popup = `
                <b style="font-size:18px;">
                🏪 ${site.site}
                </b><br><br>

                📍 ${site.adresse}<br>
                📮 ${site.cp} ${site.ville}<br><br>
                🌍 ${site.region}<br>
                🏢 ${site.filiale}<br>
                📋 ${site.typologie}<br><br>

                🕒 ${site.horaire}<br>
                ☎ ${site.telephoneMagasin}<br><br>

                <b>Responsable Site</b><br>
                🏪 ${site.responsable}<br>
                📱 ${site.responsablePortable}<br>
                📧 ${site.responsableMail}<br><br>

                <b>Coordinateur Maintenance</b><br>
                👤 ${site.crm}<br>
                📱 ${site.crmPortable}<br>
                📧 ${site.crmMail}<br><br>

                <b>Responsable Maintenance</b><br>
                👔 ${site.rrm}<br>
                📱 ${site.rrmPortable}<br>
                📧 ${site.rrmMail}<br><br>

            `;

           const crmColors = {

    "Aurelie JOLLY": "#87CEEB",
    "Christophe DUPAS": "#003F88",
    "Franck FORTAT": "#F77F00",
    "Frederic PETIT": "#4B0082",
    "Guillaume MONNET": "#FF66B3",
    "Julien MARCOUX": "#8A2BE2",
    "Karim RAHOUI": "#2F2F2F",
    "Mikael VINET": "#800020",
    "Nathalie MARTINS": "#006400",
    "Pierre GOUYOU": "#7CB342",
    "Serge DOS RAMOS": "#00BCD4",
    "Stephanie BOISSIERE": "#008B8B",
    "Youssef ANDOUR": "#FFD60A"

};

const color =
    crmColors[site.crm] || "#666666";
           
            const marker = L.circleMarker(
           [
               site.latitude,
                site.longitude
],
{
            radius: 8,
            fillColor: color, 
            color: "#ffffff",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.9
         }  
         )  
            .addTo(map)
            .bindPopup(popup);

           marker.crm = site.crm;
           
            atlasMarkers.push({
            site: site.site,   
            marker: marker                                  
           
         });
           
           crmList.add(site.crm);

           marker.filiale = site.filiale;

         if (site.filiale) {  
           filialeList.add(site.filiale);
                   }}

    });

   const crmFilter =
    document.getElementById("crmFilter");

crmList.forEach(crm => {

    const option =
        document.createElement("option");

    option.value = crm;
    option.text = crm;

    crmFilter.appendChild(option);

});

crmFilter.addEventListener("change", function () {

    const selectedCRM = this.value;

   const visibleMarkers = [];

atlasMarkers.forEach(item => {

    if (
        selectedCRM === "" ||
        item.marker.crm === selectedCRM
    ) {

        item.marker.addTo(map);
        visibleMarkers.push(
            item.marker.getLatLng()
        );

    } else {

        map.removeLayer(item.marker);

    }

});
   

   
if (visibleMarkers.length > 0) {
    map.fitBounds(visibleMarkers);
}

});
const filialeFilter =
    document.getElementById("filialeFilter");

filialeList.forEach(filiale => {

    const option =
        document.createElement("option");

    option.value = filiale;
    option.text = filiale;

    filialeFilter.appendChild(option);

});

filialeFilter.addEventListener("change", function () {

    const selectedFiliale = this.value;

    const visibleMarkers = [];

    atlasMarkers.forEach(item => {

        if (
            selectedFiliale === "" ||
            item.marker.filiale === selectedFiliale
        ) {

            item.marker.addTo(map);

            visibleMarkers.push(
                item.marker.getLatLng()
            );

        } else {

            map.removeLayer(item.marker);

        }

    });

    if (visibleMarkers.length > 0) {

        map.fitBounds(
            visibleMarkers
        );

    }

});
});

   const mapType =
    document.getElementById("mapType");

mapType.addEventListener("change", function () {

    if (this.value === "satellite") {

        map.removeLayer(plan);
        satellite.addTo(map);

    } else {

        map.removeLayer(satellite);
        plan.addTo(map);

    }

});
   
function searchSite() {

    const search = document
        .getElementById("searchBox")
        .value
        .toUpperCase();

    const result = atlasMarkers.find(item =>
        item.site.toUpperCase().includes(search)
    );

    if (result) {

        map.setView(
            result.marker.getLatLng(),
            12
        );

        result.marker.openPopup();

    } else {

        alert("Site introuvable");

    }
}
         
</script>

</body>
   
</html>
