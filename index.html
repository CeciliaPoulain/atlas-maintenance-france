<!DOCTYPE html>
<html lang="fr">
   
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Atlas Maintenance France</title>

<link rel="stylesheet"
   href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
   
html, 
    body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

#search-container {
   position: absolute;
   top: 10px;
   left: 60px;
   z-index: 9999;
   background: white;
   padding: 8px;
   border-radius: 6px;
   box-shadow: 0 2px 5px rgba(0,0,0,0.3);
   }

#searchBox {   
   width: 250px;
   padding: 6px;
   }
   
</style>
   
</head>

<body>

<div id="search-container">
<input
   type="text"
   id="searchBox"
   placeholder="🔍 Rechercher un site..."
   />
<button onclick="searchSite()">Rechercher</button>
</div>
   
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([46.6, 2.2], 6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: '&copy; OpenStreetMap'
}
).addTo(map);

const atlasMarkers = [];
   
fetch('atlas-sites.json')
.then(response => response.json())
.then(data => {

    data.forEach(site => {

        if(site.latitude && site.longitude){

            const popup = `
                <b style="font-size:18px;">
                🏪 ${site.site}
                </b><br><br>

                📍 ${site.adresse}<br>
                📮 ${site.cp} ${site.ville}<br><br>
                🌍 ${site.region}<br>
                🏢 ${site.filiale}<br>
                📋 ${site.typologie}<br><br>

                🕒 ${site.horaire}<br>
                ☎ ${site.telephoneMagasin}<br><br>

                <b>Responsable Site</b><br>
                🏪 ${site.responsable}<br>
                📱 ${site.responsablePortable}<br>
                📧 ${site.responsableMail}<br><br>

                <b>Coordinateur Maintenance</b><br>
                👤 ${site.crm}<br>
                📱 ${site.crmPortable}<br>
                📧 ${site.crmMail}<br><br>

                <b>Responsable Maintenance</b><br>
                👔 ${site.rrm}<br>
                📱 ${site.rrmPortable}<br>
                📧 ${site.rrmMail}<br><br>

            `;

            const marker = L.marker([
                site.latitude,
                site.longitude
            ])
            .addTo(map)
            .bindPopup(popup);

            atlasMarkers.push({
            site: site.site,   
            marker: marker
            });
           
                   }

    });

});
   
function searchSite() {

    const search = document
        .getElementById("searchBox")
        .value
        .toUpperCase();

    const result = atlasMarkers.find(item =>
        item.site.toUpperCase().includes(search)
    );

    if (result) {

        map.setView(
            result.marker.getLatLng(),
            12
        );

        result.marker.openPopup();

    } else {

        alert("Site introuvable");

    }
}
         
</script>

</body>
   
</html>
