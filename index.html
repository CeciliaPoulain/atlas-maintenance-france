<!DOCTYPE html>
<html lang="fr">
   
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Atlas Maintenance France</title>

<link rel="stylesheet"
   href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, 
    body {
    margin: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([46.6, 2.2], 6);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: '&copy; OpenStreetMap'
}
).addTo(map);

fetch('atlas-sites.json')
.then(response => response.json())
.then(data => {

    data.forEach(site => {

        if(site.latitude && site.longitude){

            const popup = `
                <b>${site.site}</b><br><br>

                📍 ${site.adresse}<br>
                🌍 ${site.region}<br>
                🏢 ${site.filiale}<br>
                📋 ${site.typologie}<br><br>

                🕒 ${site.horaire}<br>
                ☎ ${site.telephoneMagasin}<br><br>

                <b>Responsable magasin</b><br>
                🏪 ${site.responsable}<br>
                📱 ${site.responsablePortable}<br>
                📧 ${site.responsableMail}


                <b>CRM</b><br>
                👤 ${site.crm}<br>
                📱 ${site.crmPortable}<br>
                📧 ${site.crmMail}<br><br>

                <b>RRM</b><br>
                👔 ${site.rrm}<br>
                📱 ${site.rrmPortable}<br>
                📧 ${site.rrmMail}<br><br>

            `;

            L.marker([
                site.latitude,
                site.longitude
            ])
            .addTo(map)
            .bindPopup(popup);

        }

    });

});

</script>

</body>
</html>
